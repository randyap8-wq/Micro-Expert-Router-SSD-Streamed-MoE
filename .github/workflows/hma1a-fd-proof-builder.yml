name: MER HMA-1A fd proof hoist builder v4
on:
  push:
    branches:
      - scratch/hma1a-fd-proof-hoist-builder
permissions:
  contents: write
jobs:
  build-test-clean-child:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      BASE_SHA: 9ed3794dd7ef1fe01cc443ba5c19a491c9beabc1
      CLEAN_BRANCH: opt/hma1a-fd-proof-hoist-tested
      PATCH_SCRIPT: .github/hma1a_patch.py
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify exact clean scratch ancestry
        shell: bash
        run: |
          set -euxo pipefail
          git merge-base --is-ancestor "$BASE_SHA" HEAD
          test -z "$(git diff --name-only "$BASE_SHA" HEAD -- rust-engine)"
          git diff --name-only "$BASE_SHA" HEAD | sort > /tmp/scratch-files.txt
          printf '%s\n' \
            .github/hma1a_patch.py \
            .github/workflows/hma1a-fd-proof-builder.yml \
            | sort > /tmp/expected-scratch-files.txt
          cmp /tmp/expected-scratch-files.txt /tmp/scratch-files.txt
          test -f "$PATCH_SCRIPT"
          if git ls-remote --exit-code --heads origin "$CLEAN_BRANCH" >/dev/null 2>&1; then
            echo "clean candidate branch already exists: $CLEAN_BRANCH" >&2
            exit 1
          fi
          echo "PATCH_SCRIPT_SHA256=$(sha256sum "$PATCH_SCRIPT" | awk '{print $1}')"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: rustfmt
      - name: Apply exact HMA-1A patch
        shell: bash
        run: |
          set -euxo pipefail
          python3 "$PATCH_SCRIPT" 2>&1 | tee /tmp/hma1a-patch.log
          git diff --check
          git diff --stat "$BASE_SHA" -- rust-engine | tee /tmp/hma1a-diffstat.txt
          git diff "$BASE_SHA" -- \
            rust-engine/src/io_provider.rs \
            rust-engine/src/gpu_native_source_upload.rs \
            rust-engine/src/gpu_native_source_to_upload_copy_elision_production.rs \
            > /tmp/hma1a-rust.diff
          test "$(git diff --name-only "$BASE_SHA" -- rust-engine | wc -l)" -eq 3
      - name: Touched-file format gate
        shell: bash
        run: |
          set -euxo pipefail
          cd rust-engine
          rustfmt --edition 2021 --check \
            src/io_provider.rs \
            src/gpu_native_source_upload.rs \
            src/gpu_native_source_to_upload_copy_elision_production.rs \
            > /tmp/hma1a-touched-fmt.log 2>&1
          echo TOUCHED_FMT=PASS
      - name: Repository format baseline audit
        shell: bash
        run: |
          set +e
          cd rust-engine
          cargo fmt --check > /tmp/hma1a-repo-fmt.log 2>&1
          echo "REPO_FMT_EXIT_CODE=$?" | tee /tmp/hma1a-repo-fmt-result.txt
          exit 0
      - name: Frozen source-residency witness
        shell: bash
        run: |
          set -euxo pipefail
          cd rust-engine
          RUST_MIN_STACK=8388608 cargo test --features tokenizer \
            q4_route_parallel_source_residency_and_configuration_remain_frozen \
            -- --nocapture 2>&1 | tee /tmp/hma1a-frozen.log
      - name: HMA-1A structural witness
        shell: bash
        run: |
          set -euxo pipefail
          cd rust-engine
          RUST_MIN_STACK=8388608 cargo test --features tokenizer \
            source_upload_fd_proof_is_object_identity_cached_and_hot_read_has_no_reproof_syscalls \
            -- --nocapture 2>&1 | tee /tmp/hma1a-witness.log
      - name: Source-upload focused tests
        shell: bash
        run: |
          set -euxo pipefail
          cd rust-engine
          RUST_MIN_STACK=8388608 cargo test --features tokenizer source_upload -- --nocapture \
            2>&1 | tee /tmp/hma1a-focused.log
      - name: Full tokenizer suite
        shell: bash
        run: |
          set -euxo pipefail
          cd rust-engine
          RUST_MIN_STACK=8388608 cargo test --features tokenizer \
            2>&1 | tee /tmp/hma1a-full.log
      - name: Cargo check tests tokenizer
        shell: bash
        run: |
          set -euxo pipefail
          cd rust-engine
          RUST_MIN_STACK=8388608 cargo check --tests --features tokenizer \
            2>&1 | tee /tmp/hma1a-check.log
      - name: Canonical release build
        shell: bash
        run: |
          set -euxo pipefail
          cd rust-engine
          unset RUST_MIN_STACK RAYON_NUM_THREADS MER_PIN_CORES
          cargo build --release --features tokenizer \
            2>&1 | tee /tmp/hma1a-release.log
      - name: Freeze tested patch and evidence
        shell: bash
        run: |
          set -euxo pipefail
          git diff --check
          git diff --binary "$BASE_SHA" -- rust-engine > /tmp/hma1a-tested.patch
          PATCH_SHA="$(sha256sum /tmp/hma1a-tested.patch | awk '{print $1}')"
          SCRIPT_SHA="$(sha256sum "$PATCH_SCRIPT" | awk '{print $1}')"
          {
            echo "BASE_SHA=$BASE_SHA"
            echo "SCRATCH_HEAD=$(git rev-parse HEAD)"
            echo "PATCH_SCRIPT_GIT_BLOB=$(git rev-parse HEAD:$PATCH_SCRIPT)"
            echo "PATCH_SCRIPT_SHA256=$SCRIPT_SHA"
            echo "PATCH_SHA256=$PATCH_SHA"
            echo "DIFF_CHECK=PASS"
            echo "TOUCHED_FMT=PASS"
            cat /tmp/hma1a-repo-fmt-result.txt
            echo "FROZEN_WITNESS=PASS"
            echo "STRUCTURAL_WITNESS=PASS"
            echo "SOURCE_UPLOAD_FOCUSED=PASS"
            echo "FULL_TOKENIZER_SUITE=PASS"
            echo "CARGO_CHECK=PASS"
            echo "CANONICAL_RELEASE_BUILD=PASS"
            echo "QUALIFIER_SCHEMA=mer.gpu-native-source-to-upload-copy-elision-production.v3"
            echo "L4_RUN=NOT_RUN"
            echo "PR=NOT_OPENED"
            echo "TOUCHED_FILE_SHA256:"
            sha256sum \
              rust-engine/src/io_provider.rs \
              rust-engine/src/gpu_native_source_upload.rs \
              rust-engine/src/gpu_native_source_to_upload_copy_elision_production.rs
            git diff --stat "$BASE_SHA" -- rust-engine
          } | tee /tmp/hma1a-portable-gate.txt
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mer-hma1a-fd-proof-portable-gate-v4
          path: |
            /tmp/scratch-files.txt
            /tmp/hma1a-patch.log
            /tmp/hma1a-diffstat.txt
            /tmp/hma1a-rust.diff
            /tmp/hma1a-touched-fmt.log
            /tmp/hma1a-repo-fmt.log
            /tmp/hma1a-repo-fmt-result.txt
            /tmp/hma1a-frozen.log
            /tmp/hma1a-witness.log
            /tmp/hma1a-focused.log
            /tmp/hma1a-full.log
            /tmp/hma1a-check.log
            /tmp/hma1a-release.log
            /tmp/hma1a-tested.patch
            /tmp/hma1a-portable-gate.txt
          if-no-files-found: warn
      - name: Create exact clean tested child
        shell: bash
        run: |
          set -euxo pipefail
          PATCH_SHA="$(sha256sum /tmp/hma1a-tested.patch | awk '{print $1}')"
          git checkout -B "$CLEAN_BRANCH" "$BASE_SHA"
          git apply /tmp/hma1a-tested.patch
          git diff --check
          git add rust-engine
          git diff --cached --check
          git config user.name "Randy AP"
          git config user.email "randyap8@gmail.com"
          git commit -m "Hoist source-upload fd proof out of fused hot path [HMA-1A tested]"
          test "$(git rev-parse HEAD^)" = "$BASE_SHA"
          echo "CLEAN_HEAD=$(git rev-parse HEAD)"
          echo "CLEAN_TREE=$(git rev-parse HEAD^{tree})"
          echo "PATCH_SHA256=$PATCH_SHA"
          git push origin "HEAD:refs/heads/$CLEAN_BRANCH"