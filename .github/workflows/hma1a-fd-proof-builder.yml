name: MER HMA-1A fd proof hoist builder v3
on:
  push:
    branches:
      - scratch/hma1a-fd-proof-hoist-builder
permissions:
  contents: write
jobs:
  build-test-clean-child:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      BASE_SHA: 9ed3794dd7ef1fe01cc443ba5c19a491c9beabc1
      CLEAN_BRANCH: opt/hma1a-fd-proof-hoist-tested
      PATCH_SCRIPT_SHA256: 837b933a03ce683ad0309576548ef110aa09dcf2f5d491206a86bcfb6cf89b01
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify exact clean scratch ancestry
        shell: bash
        run: |
          set -euxo pipefail
          test "$(git rev-parse HEAD^)" = "$BASE_SHA"
          test -z "$(git diff --name-only "$BASE_SHA" HEAD -- rust-engine)"
          git diff --name-only "$BASE_SHA" HEAD | sort > /tmp/scratch-files.txt
          printf '%s\n' .github/workflows/hma1a-fd-proof-builder.yml > /tmp/expected-scratch-files.txt
          cmp /tmp/expected-scratch-files.txt /tmp/scratch-files.txt
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: rustfmt
      - name: Decode and apply exact HMA-1A patch
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import base64, gzip, hashlib
          encoded = ""
          raw = gzip.decompress(base64.b64decode(encoded))
          sha = hashlib.sha256(raw).hexdigest()
          if sha != "837b933a03ce683ad0309576548ef110aa09dcf2f5d491206a86bcfb6cf89b01":
              raise SystemExit(f"patch script sha mismatch: {sha}")
          open("/tmp/hma1a_patch.py", "wb").write(raw)
          print("PATCH_SCRIPT_SHA256=" + sha)
          PY
          python3 /tmp/hma1a_patch.py
          git diff --check
          git diff --stat "$BASE_SHA" -- rust-engine | tee /tmp/hma1a-diffstat.txt
          git diff "$BASE_SHA" -- rust-engine/src/io_provider.rs rust-engine/src/gpu_native_source_upload.rs rust-engine/src/gpu_native_source_to_upload_copy_elision_production.rs > /tmp/hma1a-rust.diff
      - name: Format audit
        shell: bash
        run: |
          set +e
          cd rust-engine
          cargo fmt --check > /tmp/hma1a-fmt.log 2>&1
          echo "FMT_EXIT_CODE=$?" | tee /tmp/hma1a-fmt-result.txt
          exit 0
      - name: HMA-1A structural witness
        shell: bash
        run: |
          set -euxo pipefail
          cd rust-engine
          RUST_MIN_STACK=8388608 cargo test --features tokenizer source_upload_fd_proof_is_object_identity_cached_and_hot_read_has_no_reproof_syscalls -- --nocapture 2>&1 | tee /tmp/hma1a-witness.log
      - name: Source-upload focused tests
        shell: bash
        run: |
          set -euxo pipefail
          cd rust-engine
          RUST_MIN_STACK=8388608 cargo test --features tokenizer source_upload -- --nocapture 2>&1 | tee /tmp/hma1a-focused.log
      - name: Full tokenizer suite
        shell: bash
        run: |
          set -euxo pipefail
          cd rust-engine
          RUST_MIN_STACK=8388608 cargo test --features tokenizer 2>&1 | tee /tmp/hma1a-full.log
      - name: Cargo check tests tokenizer
        shell: bash
        run: |
          set -euxo pipefail
          cd rust-engine
          RUST_MIN_STACK=8388608 cargo check --tests --features tokenizer 2>&1 | tee /tmp/hma1a-check.log
      - name: Canonical release build
        shell: bash
        run: |
          set -euxo pipefail
          cd rust-engine
          unset RUST_MIN_STACK RAYON_NUM_THREADS MER_PIN_CORES
          cargo build --release --features tokenizer 2>&1 | tee /tmp/hma1a-release.log
      - name: Freeze tested patch and evidence
        shell: bash
        run: |
          set -euxo pipefail
          git diff --check
          git diff --binary "$BASE_SHA" -- rust-engine > /tmp/hma1a-tested.patch
          PATCH_SHA="$(sha256sum /tmp/hma1a-tested.patch | awk '{print $1}')"
          {
            echo "BASE_SHA=$BASE_SHA"
            echo "SCRATCH_HEAD=$(git rev-parse HEAD)"
            echo "PATCH_SCRIPT_SHA256=$PATCH_SCRIPT_SHA256"
            echo "PATCH_SHA256=$PATCH_SHA"
            echo "DIFF_CHECK=PASS"
            cat /tmp/hma1a-fmt-result.txt
            echo "STRUCTURAL_WITNESS=PASS"
            echo "SOURCE_UPLOAD_FOCUSED=PASS"
            echo "FULL_TOKENIZER_SUITE=PASS"
            echo "CARGO_CHECK=PASS"
            echo "CANONICAL_RELEASE_BUILD=PASS"
            echo "QUALIFIER_SCHEMA=mer.gpu-native-source-to-upload-copy-elision-production.v3"
            echo "L4_RUN=NOT_RUN"
            echo "PR=NOT_OPENED"
            echo "TOUCHED_FILE_SHA256:"
            sha256sum rust-engine/src/io_provider.rs rust-engine/src/gpu_native_source_upload.rs rust-engine/src/gpu_native_source_to_upload_copy_elision_production.rs
            git diff --stat "$BASE_SHA" -- rust-engine
          } | tee /tmp/hma1a-portable-gate.txt
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mer-hma1a-fd-proof-portable-gate-v3
          path: |
            /tmp/scratch-files.txt
            /tmp/hma1a-diffstat.txt
            /tmp/hma1a-rust.diff
            /tmp/hma1a-fmt.log
            /tmp/hma1a-fmt-result.txt
            /tmp/hma1a-witness.log
            /tmp/hma1a-focused.log
            /tmp/hma1a-full.log
            /tmp/hma1a-check.log
            /tmp/hma1a-release.log
            /tmp/hma1a-tested.patch
            /tmp/hma1a-portable-gate.txt
          if-no-files-found: warn
      - name: Create exact clean tested child
        shell: bash
        run: |
          set -euxo pipefail
          PATCH_SHA="$(sha256sum /tmp/hma1a-tested.patch | awk '{print $1}')"
          git checkout -B "$CLEAN_BRANCH" "$BASE_SHA"
          git apply /tmp/hma1a-tested.patch
          git diff --check
          git add rust-engine
          git diff --cached --check
          git config user.name "Randy AP"
          git config user.email "randyap8@gmail.com"
          git commit -m "Hoist source-upload fd proof out of fused hot path [HMA-1A tested]"
          test "$(git rev-parse HEAD^)" = "$BASE_SHA"
          echo "CLEAN_HEAD=$(git rev-parse HEAD)"
          echo "CLEAN_TREE=$(git rev-parse HEAD^{tree})"
          echo "PATCH_SHA256=$PATCH_SHA"
          git push origin "HEAD:refs/heads/$CLEAN_BRANCH"