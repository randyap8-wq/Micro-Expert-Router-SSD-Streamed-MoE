name: MER source-upload productionization builder

on:
  push:
    branches:
      - prod/gpu-native-source-to-upload-copy-elision

permissions:
  contents: write

jobs:
  build-test-commit:
    if: github.event.head_commit.message == 'chore: temporary MER source-upload productionization builder'
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      BASE_SHA: 0bb8b421f276321f2c543035f9c8c47b013fd022
      RUST_BACKTRACE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify exact builder ancestry
        shell: bash
        run: |
          set -euxo pipefail
          test "$(git rev-parse HEAD^)" = "$BASE_SHA"
          test "$(git rev-parse "$BASE_SHA^{tree}")" = "7cd18476ac34585b21ef745e2650f5e6eb4f040a"
          git status --short

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Materialize deterministic patch script
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, gzip
          encoded = ''''''
          open('/tmp/mer_prod_source_upload_patch.py','wb').write(gzip.decompress(base64.b64decode(encoded)))
          PY
          echo "PATCH_SCRIPT_SHA256=$(sha256sum /tmp/mer_prod_source_upload_patch.py | awk '{print $1}')"

      - name: Apply deterministic productionization patch
        shell: bash
        run: |
          set -euxo pipefail
          python3 /tmp/mer_prod_source_upload_patch.py | tee /tmp/patch.log
          git diff --check
          git diff --stat "$BASE_SHA" | tee /tmp/diffstat.txt
          git status --short | tee /tmp/status-after-patch.txt

      - name: Format audit
        shell: bash
        run: |
          set +e
          cd rust-engine
          cargo fmt --check > /tmp/fmt.log 2>&1
          rc=$?
          echo "FMT_EXIT_CODE=$rc" | tee /tmp/fmt-result.txt
          # Existing repository-wide formatting debt is non-blocking here.
          exit 0

      - name: Frozen witness
        shell: bash
        run: |
          set -euxo pipefail
          cd rust-engine
          RUST_MIN_STACK=8388608 cargo test --features tokenizer \
            q4_route_parallel_source_residency_and_configuration_remain_frozen \
            -- --nocapture 2>&1 | tee /tmp/frozen-witness.log

      - name: Source-upload focused tests
        shell: bash
        run: |
          set -euxo pipefail
          cd rust-engine
          RUST_MIN_STACK=8388608 cargo test --features tokenizer source_upload -- --nocapture \
            2>&1 | tee /tmp/source-upload-tests.log

      - name: Full tokenizer test suite
        shell: bash
        run: |
          set -euxo pipefail
          cd rust-engine
          RUST_MIN_STACK=8388608 cargo test --features tokenizer \
            2>&1 | tee /tmp/full-tests.log

      - name: Cargo check tests tokenizer
        shell: bash
        run: |
          set -euxo pipefail
          cd rust-engine
          RUST_MIN_STACK=8388608 cargo check --tests --features tokenizer \
            2>&1 | tee /tmp/cargo-check.log

      - name: Canonical release build
        shell: bash
        run: |
          set -euxo pipefail
          cd rust-engine
          unset RUST_MIN_STACK
          cargo build --release --features tokenizer \
            2>&1 | tee /tmp/release-build.log

      - name: Freeze tested tree evidence
        shell: bash
        run: |
          set -euxo pipefail
          {
            echo "BUILDER_HEAD=$(git rev-parse HEAD)"
            echo "BASE_SHA=$BASE_SHA"
            echo "BASE_TREE=$(git rev-parse "$BASE_SHA^{tree}")"
            echo "PATCH_SCRIPT_SHA256=$(sha256sum /tmp/mer_prod_source_upload_patch.py | awk '{print $1}')"
            echo "RUSTC=$(rustc --version)"
            echo "CARGO=$(cargo --version)"
            echo "RUST_MIN_STACK_RELEASE=${RUST_MIN_STACK-unset}"
            echo "DIFF_CHECK=PASS"
            cat /tmp/fmt-result.txt
            echo "FROZEN_WITNESS=PASS"
            echo "SOURCE_UPLOAD_FOCUSED=PASS"
            echo "FULL_TEST_SUITE=PASS"
            echo "CARGO_CHECK=PASS"
            echo "CANONICAL_RELEASE_BUILD=PASS"
            echo "L4_RUN=NOT_RUN"
            echo "PR=NOT_OPENED"
            echo "CHANGED_FILE_SHA256:"
            for p in \
              rust-engine/src/engine.rs \
              rust-engine/src/gpu_native_residency.rs \
              rust-engine/src/gpu_native_source_upload.rs \
              rust-engine/src/io_provider.rs \
              rust-engine/src/gpu_native_source_to_upload_copy_elision_production.rs \
              rust-engine/src/gpu_native_q4_route_parallel.rs
            do
              sha256sum "$p"
            done
          } | tee /tmp/portable-gate.txt

          git diff --check
          git diff --stat "$BASE_SHA" | tee -a /tmp/portable-gate.txt

      - name: Upload portable evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mer-source-upload-production-portable-gate
          path: |
            /tmp/patch.log
            /tmp/diffstat.txt
            /tmp/status-after-patch.txt
            /tmp/fmt.log
            /tmp/fmt-result.txt
            /tmp/frozen-witness.log
            /tmp/source-upload-tests.log
            /tmp/full-tests.log
            /tmp/cargo-check.log
            /tmp/release-build.log
            /tmp/portable-gate.txt
          if-no-files-found: warn

      - name: Commit exact tested code tree
        shell: bash
        run: |
          set -euxo pipefail
          rm .github/workflows/mer-prod-source-upload-builder.yml

          git add -A
          git diff --cached --check
          git config user.name "Randy AP"
          git config user.email "randyap8@gmail.com"
          git commit -m "Productionize GPU-native source-to-upload copy elision [tested tree]"
          echo "TESTED_COMMIT=$(git rev-parse HEAD)"
          echo "TESTED_TREE=$(git rev-parse HEAD^{tree})"
          git push origin HEAD:prod/gpu-native-source-to-upload-copy-elision
